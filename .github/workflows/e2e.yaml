name: Browser checks

# Renders the output of every engine and format in Chromium, Firefox and WebKit.
# macOS runners give WebKit the Core Text font stack Safari uses.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
